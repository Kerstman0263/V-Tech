<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0A0618" />
  <title>Saldova — geen verbinding</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #0A0618; color: #fff; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; padding: 1.5rem; }
    .card { max-width: 24rem; padding: 2.25rem 1.75rem; border: 1px solid rgba(168, 85, 247, 0.2); border-radius: 1.5rem; background: #16102E; box-shadow: 0 0 50px -12px rgba(124, 58, 237, 0.4); }
    .logo { font-size: 1.4rem; font-weight: 700; }
    .logo span { color: #a78bfa; }
    .icon { width: 3.5rem; height: 3.5rem; margin: 1.5rem auto 0; display: flex; align-items: center; justify-content: center; border-radius: 1rem; background: rgba(139, 92, 246, 0.15); color: #c4b5fd; }
    h1 { margin-top: 1.1rem; font-size: 1.25rem; }
    p { margin-top: 0.7rem; font-size: 0.9rem; line-height: 1.55; color: #c4b5fd; }
    button { margin-top: 1.6rem; padding: 0.8rem 1.8rem; border: 0; border-radius: 0.8rem; background: #7C3AED; color: #fff; font-size: 0.95rem; font-weight: 600; font-family: inherit; cursor: pointer; box-shadow: 0 0 20px rgba(124, 58, 237, 0.4); }
    .hint { margin-top: 1rem; font-size: 0.75rem; color: #6b7280; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">Saldo<span>va</span></div>
    <div class="icon">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 9a15 15 0 0 1 21 0" /><path d="M5 12.5a10 10 0 0 1 14 0" /><path d="M8.5 16a5 5 0 0 1 7 0" /><circle cx="12" cy="19.5" r="0.8" fill="currentColor" /><path d="M3 3l18 18" /></svg>
    </div>
    <h1>Geen verbinding</h1>
    <p>Saldova kan de server niet bereiken. Zodra je weer online bent, gaan we automatisch verder.</p>
    <button onclick="location.reload()">Opnieuw proberen</button>
    <p class="hint">Je gegevens staan veilig in de cloud; er gaat niets verloren.</p>
  </div>
  <script>window.addEventListener("online", function () { location.reload(); });</script>
</body>
</html>
