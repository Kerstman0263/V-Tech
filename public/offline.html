<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0b0f14" />
  <title>Saldova — geen verbinding</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #0b0f14; color: #fff; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; padding: 1.5rem; }
    .card { max-width: 24rem; padding: 2.25rem 1.75rem; border: 1px solid #1f2937; border-radius: 1.5rem; background: #11161d; }
    .logo { display: flex; align-items: center; justify-content: center; gap: 0.6rem; font-size: 0.95rem; }
    .ei { height: 1.75rem; width: auto; }
    .icon { width: 3.5rem; height: 3.5rem; margin: 1.5rem auto 0; display: flex; align-items: center; justify-content: center; border-radius: 1rem; background: #0b0f14; border: 1px solid #1f2937; color: #a78bfa; }
    h1 { margin-top: 1.1rem; font-size: 1.25rem; }
    p { margin-top: 0.7rem; font-size: 0.9rem; line-height: 1.55; color: #cbd5e1; }
    button { margin-top: 1.6rem; padding: 0.8rem 1.8rem; border: 0; border-radius: 0.8rem; background: #fff; color: #0b0f14; font-size: 0.95rem; font-weight: 600; font-family: inherit; cursor: pointer; }
    button:hover { background: #f1f5f9; }
    button:focus-visible { outline: 2px solid #a78bfa; outline-offset: 2px; }
    .hint { margin-top: 1rem; font-size: 0.75rem; color: #94a3b8; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo"><svg class="ei" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 124"><defs><linearGradient id="ei-saldova-v" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b49cff"/><stop offset="1" stop-color="#6d28d9"/></linearGradient><mask id="ei-saldova-m" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="124"><rect width="100" height="124" fill="white"/><polygon points="-5,90 105,49 105,56 -5,97" fill="black"/></mask></defs><path d="M50 2C77 2 98 42 98 76C98 106 77 122 50 122C23 122 2 106 2 76C2 42 23 2 50 2Z" fill="url(#ei-saldova-v)" mask="url(#ei-saldova-m)"/></svg><span style="letter-spacing:.28em;font-weight:500;text-transform:uppercase"><span style="color:#a78bfa">SALD</span>OVA</span></div>
    <div class="icon">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 9a15 15 0 0 1 21 0" /><path d="M5 12.5a10 10 0 0 1 14 0" /><path d="M8.5 16a5 5 0 0 1 7 0" /><circle cx="12" cy="19.5" r="0.8" fill="currentColor" /><path d="M3 3l18 18" /></svg>
    </div>
    <h1>Geen verbinding</h1>
    <p>Saldova kan de server niet bereiken. Zodra je weer online bent, gaan we automatisch verder.</p>
    <button onclick="location.reload()">Opnieuw proberen</button>
    <p class="hint">Je gegevens staan veilig in de cloud; er gaat niets verloren.</p>
  </div>
  <script>window.addEventListener("online", function () { location.reload(); });</script>
</body>
</html>
